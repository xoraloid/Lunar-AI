<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --window: #0d1117;
      --titlebar: #161b22;
      --border: #21262d;
      --text: #e2e8f0;
      --muted: #8b949e;
      --accent: #d2a8ff;
      --green: #7ee787;
      --blue: #58a6ff;
      --yellow: #e3b341;
      --red: #f85149;
      --input-bg: #161b22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.6;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 8px;
    }
    .window {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--window);
      border: 2px solid var(--border);
      overflow: hidden;
      position: relative;
      min-height: 640px;
    }
    .titlebar {
      background: var(--titlebar);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dots { display: flex; gap: 5px; }
    .dot { width: 10px; height: 10px; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .logo svg { width: 18px; height: 18px; }
    .lunar-logo { color: var(--text); font-size: 11px; }
    .badge {
      color: var(--green);
      font-size: 9px;
      background: rgba(126,231,135,0.12);
      border: 1px solid var(--green);
      padding: 3px 8px;
    }
    .main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 200px;
      background: var(--window);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }
    .sidebar-title {
      color: var(--accent);
      font-size: 10px;
    }
    .upload-zone {
      border: 2px dashed var(--border);
      padding: 12px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      cursor: pointer;
    }
    .upload-zone:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .file-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #console {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }
    .boot-banner {
      background: var(--titlebar);
      border: 2px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .boot-logo svg { width: 32px; height: 32px; }
    .boot-title { color: var(--accent); font-size: 12px; }
    .boot-sub { color: var(--muted); font-size: 9px; margin-top: 4px; }
    .line {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .info { color: var(--blue); }
    .prompt-symbol { color: var(--green); margin-right: 6px; }
    .user-text { color: var(--text); }
    .lunar-tag { color: var(--accent); }
    .timer-tag { color: var(--muted); font-size: 9px; }
    .thinking-text { color: var(--yellow); }
    .lunar-text { color: var(--text); }
    .research-line { color: var(--blue); font-size: 10px; margin-bottom: 6px; }
    .generated-image, .uploaded-image {
      max-width: 100%;
      max-height: 280px;
      border: 2px solid var(--border);
      margin: 10px 0;
      display: block;
      image-rendering: pixelated;
    }
    .speak-btn {
      background: var(--titlebar);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
    }
    .cooldown-msg {
      color: var(--red);
      border: 1px solid var(--red);
      padding: 8px 10px;
      margin: 6px 0;
      display: inline-block;
      font-size: 10px;
    }
    .input-area {
      padding: 10px;
      background: var(--window);
      border-top: 2px solid var(--border);
    }
    #send-form {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--input-bg);
      border: 2px solid var(--border);
      padding: 8px 10px;
    }
    #send-form:focus-within { border-color: var(--green); }
    #prompt {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
    }
    #send-btn {
      background: #238636;
      color: white;
      border: none;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    #send-btn:disabled {
      background: var(--border);
      color: var(--muted);
    }
    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 8px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
    }
    #settings-panel {
      display: none;
      position: absolute;
      top: 48px;
      right: 12px;
      width: 280px;
      background: var(--titlebar);
      border: 2px solid var(--border);
      z-index: 100;
      padding: 14px;
      max-height: 75vh;
      overflow-y: auto;
    }
    #settings-panel.open { display: block; }
    .settings-title {
      color: var(--accent);
      font-size: 11px;
      margin-bottom: 12px;
    }
    .settings-section { margin-bottom: 14px; }
    .settings-label {
      color: var(--muted);
      font-size: 9px;
      margin-bottom: 6px;
      display: block;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .theme-btn, .toggle-btn {
      background: var(--window);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 6px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      text-align: center;
    }
    .theme-btn.active, .toggle-btn.active {
      border-color: var(--green);
      background: rgba(126,231,135,0.12);
      color: var(--green);
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 10px;
    }
    #toast {
      position: absolute;
      bottom: 70px;
      right: 16px;
      background: var(--titlebar);
      border: 2px solid var(--green);
      color: var(--green);
      padding: 10px 14px;
      font-size: 10px;
      z-index: 200;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.25s;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    #file-input { display: none; }
    .code-btn {
      background: var(--titlebar);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="title-left">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#1a1f2e" stroke="#d2a8ff" stroke-width="1.5"/>
            <path d="M15.5 8.5C14.2 7.8 12.7 7.5 11.2 7.8C9.1 8.2 7.5 9.7 7 11.7C6.4 14.1 7.6 16.5 9.8 17.5C11.5 18.3 13.5 18 15 16.9C13.8 16.7 12.7 15.9 12.2 14.7C11.5 12.9 12.2 10.9 13.9 10C14.6 9.6 15.4 9.5 16.1 9.7C15.9 9.2 15.7 8.8 15.5 8.5Z" fill="#d2a8ff"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="#7ee787"/>
          </svg>
        </div>
        <div class="lunar-logo">LUNAR AI</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="settings-btn" id="settings-btn">⚙ SETTINGS</button>
        <div class="badge" id="state-badge">ONLINE</div>
      </div>
    </div>

    <div id="settings-panel">
      <div class="settings-title">SETTINGS</div>
      <div class="settings-section">
        <span class="settings-label">SOUND & NOTIFICATIONS</span>
        <div class="toggle-row">
          <span>Bloop Sound</span>
          <button class="toggle-btn active" id="toggle-sound">ON</button>
        </div>
        <div class="toggle-row">
          <span>Notifications</span>
          <button class="toggle-btn active" id="toggle-notif">ON</button>
        </div>
        <div class="toggle-row">
          <span>Auto-Speak</span>
          <button class="toggle-btn" id="toggle-autospeak">OFF</button>
        </div>
      </div>
      <div class="settings-section">
        <span class="settings-label">THEME</span>
        <div class="theme-grid">
          <button class="theme-btn active" data-theme="lunar">Lunar</button>
          <button class="theme-btn" data-theme="matrix">Matrix</button>
          <button class="theme-btn" data-theme="cyber">Cyberpunk</button>
          <button class="theme-btn" data-theme="ocean">Ocean</button>
          <button class="theme-btn" data-theme="ember">Ember</button>
          <button class="theme-btn" data-theme="forest">Forest</button>
        </div>
      </div>
    </div>

    <div id="toast">Reply ready!</div>

    <div class="main-area">
      <div class="sidebar">
        <div class="sidebar-title">DOCUMENTS</div>
        <div class="upload-zone" id="upload-zone">
          DROP / CLICK<br>
          <span style="font-size:8px;opacity:0.7">txt md images</span>
        </div>
        <input type="file" id="file-input" multiple accept=".txt,.md,.json,.py,.js,.html,image/*">
        <div class="file-list" id="file-list"></div>
        <button class="code-btn" id="new-note-btn">+ NEW NOTE</button>
      </div>

      <div class="chat-area">
        <div id="console">
          <div class="boot-banner">
            <div class="boot-logo">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#1a1f2e" stroke="#d2a8ff" stroke-width="1.5"/>
                <path d="M15.5 8.5C14.2 7.8 12.7 7.5 11.2 7.8C9.1 8.2 7.5 9.7 7 11.7C6.4 14.1 7.6 16.5 9.8 17.5C11.5 18.3 13.5 18 15 16.9C13.8 16.7 12.7 15.9 12.2 14.7C11.5 12.9 12.2 10.9 13.9 10C14.6 9.6 15.4 9.5 16.1 9.7C15.9 9.2 15.7 8.8 15.5 8.5Z" fill="#d2a8ff"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="#7ee787"/>
              </svg>
            </div>
            <div>
              <div class="boot-title">LUNAR AI</div>
              <div class="boot-sub">Hosted version • Full power</div>
            </div>
          </div>
        </div>
        <div class="input-area">
          <form id="send-form">
            <span class="prompt-symbol">&gt;&gt;&gt;</span>
            <input id="prompt" type="text" placeholder="Ask anything..." spellcheck="false" autocomplete="off">
            <button id="send-btn" type="submit">SEND</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Settings with localStorage
      let settings = {
        sound: localStorage.getItem('lunar_sound') !== 'false',
        notif: localStorage.getItem('lunar_notif') !== 'false',
        autospeak: localStorage.getItem('lunar_autospeak') === 'true',
        theme: localStorage.getItem('lunar_theme') || 'lunar'
      };

      const themes = {
        lunar: {
          '--bg': '#090b10', '--window': '#0d1117', '--titlebar': '#161b22',
          '--border': '#21262d', '--text': '#e2e8f0', '--muted': '#8b949e',
          '--accent': '#d2a8ff', '--green': '#7ee787', '--blue': '#58a6ff',
          '--yellow': '#e3b341', '--red': '#f85149', '--input-bg': '#161b22'
        },
        matrix: {
          '--bg': '#000', '--window': '#0a0f0a', '--titlebar': '#0d1a0d',
          '--border': '#1a3a1a', '--text': '#00ff41', '--muted': '#008f11',
          '--accent': '#00ff41', '--green': '#00ff41', '--blue': '#00cc33',
          '--yellow': '#33ff33', '--red': '#ff3333', '--input-bg': '#0d1a0d'
        },
        cyber: {
          '--bg': '#0d0221', '--window': '#16062e', '--titlebar': '#1e0a3c',
          '--border': '#3a1a5c', '--text': '#f0e6ff', '--muted': '#a78bfa',
          '--accent': '#ff2a6d', '--green': '#05d9e8', '--blue': '#d300c5',
          '--yellow': '#f9f002', '--red': '#ff2a6d', '--input-bg': '#1e0a3c'
        },
        ocean: {
          '--bg': '#0a1628', '--window': '#0f1c2e', '--titlebar': '#15253b',
          '--border': '#1e3a5f', '--text': '#e0f2fe', '--muted': '#7dd3fc',
          '--accent': '#38bdf8', '--green': '#2dd4bf', '--blue': '#0ea5e9',
          '--yellow': '#fbbf24', '--red': '#f87171', '--input-bg': '#15253b'
        },
        ember: {
          '--bg': '#1a0a0a', '--window': '#2a1212', '--titlebar': '#3a1a1a',
          '--border': '#5c2a2a', '--text': '#ffe4e4', '--muted': '#fca5a5',
          '--accent': '#fb923c', '--green': '#fbbf24', '--blue': '#f87171',
          '--yellow': '#fcd34d', '--red': '#ef4444', '--input-bg': '#3a1a1a'
        },
        forest: {
          '--bg': '#0a140a', '--window': '#0f1f0f', '--titlebar': '#142814',
          '--border': '#1e3a1e', '--text': '#e8f5e8', '--muted': '#86efac',
          '--accent': '#4ade80', '--green': '#22c55e', '--blue': '#a3e635',
          '--yellow': '#facc15', '--red': '#f87171', '--input-bg': '#142814'
        }
      };

      function applyTheme(name) {
        const t = themes[name] || themes.lunar;
        Object.entries(t).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
        settings.theme = name;
        localStorage.setItem('lunar_theme', name);
        document.querySelectorAll('.theme-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.theme === name);
        });
      }
      applyTheme(settings.theme);

      let history = [];
      let lastGeneratedText = "";
      let isBusy = false;
      let documents = [];
      let docIdCounter = 1;
      let lastImageTime = 0;
      const IMAGE_COOLDOWN = 40000;

      const consoleEl = document.getElementById('console');
      const promptEl = document.getElementById('prompt');
      const sendBtn = document.getElementById('send-btn');
      const badgeEl = document.getElementById('state-badge');

      function printLine(html) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = html;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
        return div;
      }

      function escapeHTML(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function setBusy(v) {
        isBusy = v;
        promptEl.disabled = v;
        sendBtn.disabled = v;
        sendBtn.textContent = v ? '...' : 'SEND';
        badgeEl.textContent = v ? 'THINKING' : 'ONLINE';
        if (!v) promptEl.focus();
      }

      function playBloop() {
        if (!settings.sound) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'square';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.07);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } catch (e) {}
      }

      function showToast(msg) {
        if (!settings.notif) return;
        const t = document.getElementById('toast');
        t.textContent = msg || 'Reply ready!';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      }

      // Settings panel
      document.getElementById('settings-btn').onclick = () => {
        document.getElementById('settings-panel').classList.toggle('open');
      };
      document.addEventListener('click', e => {
        const p = document.getElementById('settings-panel');
        if (!p.contains(e.target) && e.target.id !== 'settings-btn') {
          p.classList.remove('open');
        }
      });

      document.querySelectorAll('.theme-btn').forEach(b => {
        b.onclick = () => applyTheme(b.dataset.theme);
      });

      function updateToggle(btn, state) {
        btn.textContent = state ? 'ON' : 'OFF';
        btn.classList.toggle('active', state);
      }

      updateToggle(document.getElementById('toggle-sound'), settings.sound);
      updateToggle(document.getElementById('toggle-notif'), settings.notif);
      updateToggle(document.getElementById('toggle-autospeak'), settings.autospeak);

      document.getElementById('toggle-sound').onclick = function () {
        settings.sound = !settings.sound;
        localStorage.setItem('lunar_sound', settings.sound);
        updateToggle(this, settings.sound);
        if (settings.sound) playBloop();
      };
      document.getElementById('toggle-notif').onclick = function () {
        settings.notif = !settings.notif;
        localStorage.setItem('lunar_notif', settings.notif);
        updateToggle(this, settings.notif);
      };
      document.getElementById('toggle-autospeak').onclick = function () {
        settings.autospeak = !settings.autospeak;
        localStorage.setItem('lunar_autospeak', settings.autospeak);
        updateToggle(this, settings.autospeak);
      };

      // File upload
      document.getElementById('upload-zone').onclick = () => {
        document.getElementById('file-input').click();
      };
      document.getElementById('file-input').onchange = e => {
        Array.from(e.target.files).forEach(f => {
          if (f.type.startsWith('image/')) {
            const r = new FileReader();
            r.onload = ev => {
              documents.push({
                id: docIdCounter++,
                name: f.name,
                content: '',
                isImage: true,
                dataUrl: ev.target.result
              });
              printLine(`<span class="info">[lunar] Image loaded</span><br><img class="uploaded-image" src="${ev.target.result}">`);
            };
            r.readAsDataURL(f);
          } else {
            const r = new FileReader();
            r.onload = ev => {
              documents.push({
                id: docIdCounter++,
                name: f.name,
                content: ev.target.result,
                isImage: false
              });
              printLine(`<span class="info">[lunar] File loaded: ${escapeHTML(f.name)}</span>`);
            };
            r.readAsText(f);
          }
        });
        e.target.value = '';
      };

      document.getElementById('new-note-btn').onclick = () => {
        const name = 'Note ' + (documents.length + 1) + '.txt';
        documents.push({
          id: docIdCounter++,
          name,
          content: '',
          isImage: false
        });
        printLine(`<span class="info">[lunar] New note created</span>`);
      };

      // Boot messages
      printLine('<span class="info">[lunar] Ready. Full version running.</span>');
      printLine('<span class="lunar-tag">Lunar:</span> <span class="lunar-text">Hey! Ask me anything. You can also say "make it shorter" after I write something.</span>');

      async function handleSend(text) {
        text = (text || '').trim();
        if (!text || isBusy) return;

        printLine(`<span class="prompt-symbol">&gt;&gt;&gt;</span><span class="user-text">${escapeHTML(text)}</span>`);
        promptEl.value = '';
        setBusy(true);

        const lower = text.toLowerCase();
        const isEditCommand = /^(make it |make this |can you make it |could you make it |please make it )?(shorter|longer|simpler|more formal|less formal|more casual|better|clearer|rewrite|rephrase|improve|fix|edit)/i.test(lower) ||
          /^(shorter|longer|simplify|rewrite|rephrase|improve it|edit it)/i.test(lower);

        let finalPrompt = text;
        if (isEditCommand && lastGeneratedText) {
          finalPrompt = `Here is the previous text I wrote:\n\n"""\n${lastGeneratedText}\n"""\n\nThe user now says: "${text}"\n\nPlease modify the previous text according to their request and return ONLY the new version of the text.`;
        }

        // Image generation
        if (/\b(generate|create|draw|make).+\b(image|picture|drawing)\b/i.test(text) || /\bimage of\b/i.test(text)) {
          const now = Date.now();
          if (now - lastImageTime < IMAGE_COOLDOWN) {
            printLine(`<span class="lunar-tag">Lunar:</span> <span class="cooldown-msg">Wait ${Math.ceil((IMAGE_COOLDOWN - (now - lastImageTime)) / 1000)}s</span>`);
            setBusy(false);
            return;
          }
          const thinkingLine = printLine('<span class="research-line">→ Making image...</span>');
          const p = text.replace(/\b(generate|create|draw|make|show|an?|the|image|picture|drawing|of)\b/gi, '').trim() || text;
          const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=768&height=768&nologo=true&seed=${Date.now() % 999999}`;
          lastImageTime = Date.now();

          const img = new Image();
          img.onload = () => {
            thinkingLine.innerHTML = `<span class="lunar-tag">Lunar:</span><br><img class="generated-image" src="${url}">`;
            playBloop();
            showToast('Image ready!');
            setBusy(false);
          };
          img.onerror = () => {
            thinkingLine.innerHTML = `<span class="lunar-tag">Lunar:</span> <span class="cooldown-msg">Image failed. Try again later.</span>`;
            setBusy(false);
          };
          img.src = url;
          return;
        }

        // Text reply
        const thinkingLine = printLine('<span class="research-line">→ Thinking...</span><br><span class="lunar-tag">Lunar:</span> <span class="thinking-text">...</span>');
        const start = performance.now();
        let dots = 0;
        const anim = setInterval(() => {
          dots = (dots + 1) % 4;
          thinkingLine.innerHTML = `<span class="research-line">→ Thinking...</span><br><span class="lunar-tag">Lunar:</span> <span class="thinking-text">${'.'.repeat(dots + 1)}</span>`;
        }, 280);

        try {
          const reply = await getAIReply(finalPrompt);
          clearInterval(anim);

          if (reply.length > 80 && !/what can you do|i can help with/i.test(reply)) {
            lastGeneratedText = reply;
          }

          history.push({ role: 'user', content: text });
          history.push({ role: 'assistant', content: reply });
          if (history.length > 14) history = history.slice(-14);

          const t = ((performance.now() - start) / 1000).toFixed(1);
          thinkingLine.innerHTML = `
            <span class="lunar-tag">Lunar</span> <span class="timer-tag">(${t}s)</span>:<br>
            <span class="lunar-text">${escapeHTML(reply).replace(/\n/g, '<br>')}</span><br>
            <button class="speak-btn" data-text="${escapeHTML(reply.slice(0, 700))}">Speak</button>
          `;

          playBloop();
          showToast('Reply ready!');

          if (settings.autospeak) {
            try {
              speechSynthesis.speak(new SpeechSynthesisUtterance(reply.slice(0, 900)));
            } catch (e) {}
          }
        } catch (err) {
          clearInterval(anim);
          thinkingLine.innerHTML = `<span style="color:var(--red)">Error: ${escapeHTML(err.message || 'Something went wrong')}</span>`;
        }
        setBusy(false);
      }

      async function getAIReply(promptForModel) {
        const systemPrompt = `You are Lunar, a helpful AI with a calm, slightly retro terminal personality.

Important rules:
- If the user previously asked you to write text and now says "make it shorter", "make it longer", "rewrite it", etc., you MUST modify the previous text and return ONLY the new version.
- Never reply with a generic "what I can do" list when the user is clearly asking to edit previous text.
- Never mention PickCode or any external platforms.
- Do not generate or suggest any links that open new windows or popups.
- Be concise and helpful.`;

        const fullPrompt = `${systemPrompt}

Recent conversation:
${history.map(h => `${h.role}: ${h.content}`).join('\n')}

User: ${promptForModel}

Lunar:`;

        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai&seed=${Date.now()}`);
        if (!res.ok) throw new Error('Could not reach AI service');
        let reply = await res.text();
        return reply.trim().replace(/^Lunar:\s*/i, '');
      }

      // Speak button
      document.addEventListener('click', e => {
        if (e.target.classList.contains('speak-btn')) {
          const txt = e.target.getAttribute('data-text') || '';
          if (txt) {
            try {
              speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
            } catch (err) {}
          }
        }
      });

      document.getElementById('send-form').onsubmit = e => {
        e.preventDefault();
        handleSend(promptEl.value);
      };
    })();
  </script>
</body>
</html>
